name: Remove compiled ELF binaries

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find and remove ELF binaries
        shell: python
        run: |
          import os
          import subprocess

          files = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode().split("\0")

          removed = []

          for path in files:
              if not path or not os.path.isfile(path):
                  continue

              with open(path, "rb") as f:
                  magic = f.read(4)

              if magic == b"\x7fELF":
                  print(f"Removing ELF: {path}")
                  subprocess.run(
                      ["git", "rm", "--", path],
                      check=True
                  )
                  removed.append(path)

          print()
          print(f"Total ELF files removed: {len(removed)}")

      - name: Show changes
        run: |
          git status --short
          echo
          echo "Remaining tracked ELF files:"
          python - <<'PY'
          import os
          import subprocess

          files = subprocess.check_output(
              ["git", "ls-files", "-z"]
          ).decode().split("\0")

          found = 0

          for path in files:
              if not path or not os.path.isfile(path):
                  continue

              with open(path, "rb") as f:
                  if f.read(4) == b"\x7fELF":
                      print(path)
                      found += 1

          print(f"Remaining ELF files: {found}")
          PY

      - name: Commit and push
        run: |
          if git diff --cached --quiet; then
            echo "No ELF binaries were removed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Remove compiled ELF binaries"
          git push origin HEAD:main
